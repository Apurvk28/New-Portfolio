<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Apurv Khairnar Portfolio</title>
  <meta name="description" content="Portfolio of Apurv Khairnar, a talented full stack developer & designer specializing in React, Node.js, UI/UX, and Web Engineering.">
  
  <!-- Typography Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <script>
    // Always redirect to main landing page on page refresh / load
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    if (window.location.hash) {
      history.replaceState(null, '', window.location.pathname);
    }
    window.scrollTo(0, 0);
  </script>
</head>
<body class="antialiased text-[#111] bg-[#FAFAFA]">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
